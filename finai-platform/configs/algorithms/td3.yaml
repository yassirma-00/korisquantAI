meta:
  algo: td3
  family: actor_critic
  action_space: continuous
  backend: sb3
  description: DDPG with twin critics and target-policy smoothing.
training:
  total_timesteps: 25000
optimizer:
  learning_rate: 0.001
  batch_size: 64
replay:
  buffer_size: 50000
  learning_starts: 500
off_policy:
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  train_freq: 1
  gradient_steps: 1
