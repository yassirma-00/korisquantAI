meta:
  algo: sac
  family: actor_critic
  action_space: continuous
  backend: sb3
  description: Maximum-entropy off-policy actor-critic; strong for portfolio weights.
training:
  total_timesteps: 25000
optimizer:
  learning_rate: 0.0003
  batch_size: 64
replay:
  buffer_size: 50000
  learning_starts: 500
off_policy:
  tau: 0.005
  ent_coef: auto
  train_freq: 1
  gradient_steps: 1
network:
  hidden:
  - 128
  - 128
