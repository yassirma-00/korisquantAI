meta:
  algo: ddpg
  family: actor_critic
  action_space: continuous
  backend: sb3
  description: Deterministic off-policy actor-critic; prone to Q overestimation.
training:
  total_timesteps: 25000
optimizer:
  learning_rate: 0.001
  batch_size: 64
replay:
  buffer_size: 50000
  learning_starts: 500
off_policy:
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
