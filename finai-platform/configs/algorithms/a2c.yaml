meta:
  algo: a2c
  family: policy_gradient
  action_space: both
  backend: sb3
  description: Synchronous advantage actor-critic; fast but noisier than PPO.
training:
  total_timesteps: 30000
optimizer:
  learning_rate: 0.0007
policy_gradient:
  n_steps: 512
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  clip_range: null
  n_epochs: null
